name: Portfolio quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate portfolio structure and content
        run: python3 scripts/check_portfolio.py
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Test responsive layout, navigation and progressive enhancement
        run: python3 scripts/test_portfolio.py
      - name: Upload screenshots and layout metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-screenshots
          path: artifacts/
          if-no-files-found: warn
